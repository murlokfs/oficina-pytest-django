name: Django Tests # Define o nome exibido para este fluxo no GitHub Actions.

on: # Determina quais eventos do GitHub acionam este fluxo.
  pull_request: # Executa o fluxo quando um pull request é criado ou atualizado.

jobs: # Agrupa os trabalhos que serão executados pelo fluxo.

  tests: # Define o trabalho responsável por executar os testes.

    runs-on: ubuntu-latest # Escolhe a imagem Linux usada para executar o trabalho.

    steps: # Lista as etapas executadas, em ordem, pelo trabalho.

      - uses: actions/checkout@v4 # Baixa o código do repositório para o ambiente de execução.

      - uses: actions/setup-python@v5 # Configura o Python no ambiente de execução.

        with: # Inicia as opções da ação de configuração do Python.

          python-version: "3.12" # Define a versão do Python a ser instalada.

      - name: Install dependencies # Nomeia a etapa que instala as dependências do projeto.

        run: | # Indica que as linhas a seguir formam um script de terminal.
          python -m pip install --upgrade pip # Atualiza o gerenciador de pacotes pip.
          pip install -r requirements.txt # Instala os pacotes declarados no arquivo de requisitos.

      - name: Run tests and coverage # Nomeia a etapa que executa os testes e mede a cobertura.

        run: | # Indica que as linhas a seguir formam um script de terminal.
          python -m pytest --cov=authentication --cov=library --cov-report=term-missing --cov-fail-under=80 
          
          # Executa os testes, exibe linhas não cobertas e exige ao menos 80% de cobertura.
 